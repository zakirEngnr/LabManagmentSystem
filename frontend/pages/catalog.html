<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Catalog — Arham Diagnostic Laboratory</title>

<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>

<div class="app-shell">

    <header class="topbar">
        <div class="brand">
            <img src="/assets/img/logo.png" alt="" class="brand-logo"
                 onerror="this.style.display='none'">
            <span>Arham Diagnostic Laboratory</span>
            <span class="brand-sub">Shalbandi, Buner</span>
        </div>
        <div class="meta">
            <span id="clock" class="clock">--:--:--</span>
            <button class="logout-btn" onclick="auth.logout()">Logout</button>
        </div>
    </header>

    <aside class="sidebar">
        <div class="nav-section">Main</div>
        <a href="../index.html" class="nav-item">
            <span class="nav-icon"></span> Dashboard
        </a>
        <a href="./new-visit.html" class="nav-item">
            <span class="nav-icon"></span> New Visit
        </a>
        <a href="./visits.html" class="nav-item">
            <span class="nav-icon"></span> Visits
        </a>
        <a href="./patients.html" class="nav-item">
            <span class="nav-icon"></span> Patients
        </a>
        <a href="./reports.html" class="nav-item">
            <span class="nav-icon"></span> Reports
        </a>
        <div class="nav-divider"></div>
        <div class="nav-section">Settings</div>
        <a href="./catalog.html" class="nav-item active">
            <span class="nav-icon"></span> Test Catalog
        </a>
    </aside>

    <main class="main">

        <div class="page-header">
            <div class="page-header-left">
                <h1>Test Catalog</h1>
                <span class="subtitle" id="catalogCount">Loading…</span>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder=" Search tests by name or code…">
            <select id="categoryFilter">
                <option value="">All Categories</option>
            </select>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Test Name</th>
                        <th>Category</th>
                        <th class="text-right">Fields</th>
                        <th class="text-right">Price</th>
                    </tr>
                </thead>
                <tbody id="catalogBody"></tbody>
            </table>
        </div>

    </main>

</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/animations.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/pages/catalog.js"></script>

</body>
</html>
