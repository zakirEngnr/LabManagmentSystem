<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient — Arham Diagnostic Laboratory</title>

<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>

<div class="app-shell">

    <header class="topbar">
        <div class="brand">
            <img src="/assets/img/logo.png" alt="" class="brand-logo"
                 onerror="this.style.display='none'">
            <span>Arham Diagnostic Laboratory</span>
            <span class="brand-sub">Shalbandi, Buner</span>
        </div>
        <div class="meta">
            <span id="clock" class="clock">--:--:--</span>
            <button class="logout-btn" onclick="auth.logout()">Logout</button>
        </div>
    </header>

    <aside class="sidebar">
        <div class="nav-section">Main</div>
        <a href="../index.html" class="nav-item">
            <span class="nav-icon"></span> Dashboard
        </a>
        <a href="./new-visit.html" class="nav-item">
            <span class="nav-icon"></span> New Visit
        </a>
        <a href="./visits.html" class="nav-item">
            <span class="nav-icon"></span> Visits
        </a>
        <a href="./patients.html" class="nav-item active">
            <span class="nav-icon"></span> Patients
        </a>
        <a href="./reports.html" class="nav-item">
            <span class="nav-icon"></span> Reports
        </a>
        <div class="nav-divider"></div>
        <div class="nav-section">Settings</div>
        <a href="./catalog.html" class="nav-item">
            <span class="nav-icon"></span> Test Catalog
        </a>
    </aside>

    <main class="main">

        <button class="back-link" onclick="location.href='./patients.html'">← Back to patients</button>

        <div class="page-header">
            <div class="page-header-left">
                <h1 id="patientTitle">Patient —</h1>
                <span class="subtitle" id="patientSubtitle">Loading…</span>
            </div>
            <div class="page-header-actions">
                <a href="./new-visit.html" class="btn btn-primary"> New Visit</a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>Details</h3>
            </div>
            <div id="patientDetails"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>Visit History</h3>
                <span class="text-muted" id="visitCount"></span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Visit #</th>
                            <th>Date</th>
                            <th>Tests</th>
                            <th class="text-right">Amount</th>
                            <th>Payment</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="visitHistoryBody"></tbody>
                </table>
            </div>
        </div>

    </main>

</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/animations.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/pages/patient.js"></script>

</body>
</html>
