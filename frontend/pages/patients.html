<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patients — Arham Diagnostic Laboratory</title>

<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>

<div class="app-shell">

    <header class="topbar">
        <div class="brand">
            <img src="/assets/img/logo.png" alt="" class="brand-logo"
                 onerror="this.style.display='none'">
            <span>Arham Diagnostic Laboratory</span>
            <span class="brand-sub">Shalbandi, Buner</span>
        </div>
        <div class="meta">
            <span id="clock" class="clock">--:--:--</span>
            <button class="logout-btn" onclick="auth.logout()">Logout</button>
        </div>
    </header>

    <aside class="sidebar">
        <div class="nav-section">Main</div>
        <a href="../index.html" class="nav-item">
            <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="./new-visit.html" class="nav-item">
            <span class="nav-icon">➕</span> New Visit
        </a>
        <a href="./visits.html" class="nav-item">
            <span class="nav-icon">📋</span> Visits
        </a>
        <a href="./patients.html" class="nav-item active">
            <span class="nav-icon">👥</span> Patients
        </a>
        <a href="./reports.html" class="nav-item">
            <span class="nav-icon">📈</span> Reports
        </a>
        <div class="nav-divider"></div>
        <div class="nav-section">Settings</div>
        <a href="./catalog.html" class="nav-item">
            <span class="nav-icon">📚</span> Test Catalog
        </a>
    </aside>

    <main class="main">

        <div class="page-header">
            <div class="page-header-left">
                <h1>Patients</h1>
                <span class="subtitle" id="patientCount">Loading…</span>
            </div>
            <div class="page-header-actions">
                <button class="btn btn-primary" onclick="openAddPatient()">
                    ➕ New Patient
                </button>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Search by name, patient ID, or contact…">
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Contact</th>
                        <th class="text-right">Visits</th>
                    </tr>
                </thead>
                <tbody id="patientsTableBody"></tbody>
            </table>
        </div>

    </main>

</div>

<!-- ============ ADD PATIENT MODAL ============ -->
<div id="patientModal" class="modal-overlay hidden">
    <div class="modal">
        <h3>New Patient</h3>

        <div class="form-row">
            <div class="form-group">
                <label>Name <span class="required">*</span></label>
                <input type="text" id="pName" placeholder="e.g. Ali Khan" maxlength="100">
            </div>
            <div class="form-group">
                <label>Age <span class="required">*</span></label>
                <input type="number" id="pAge" placeholder="e.g. 32" min="0" max="150">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Gender <span class="required">*</span></label>
                <select id="pGender">
                    <option value="">— Select —</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Contact</label>
                <input type="text" id="pContact" placeholder="e.g. 0300-1234567" maxlength="30">
            </div>
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text" id="pAddress" placeholder="Optional" maxlength="200">
        </div>

        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closePatientModal()">Cancel</button>
            <button class="btn btn-primary" id="savePatientBtn" onclick="savePatient()">
                Save Patient
            </button>
        </div>
    </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/animations.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/pages/patients.js"></script>

</body>
</html>
