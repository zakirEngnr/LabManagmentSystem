<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Visit — Arham Diagnostic Laboratory</title>

<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>

<div class="app-shell">

    <header class="topbar">
        <div class="brand">
            <img src="/assets/img/logo.png" alt="" class="brand-logo"
                 onerror="this.style.display='none'">
            <span>Arham Diagnostic Laboratory</span>
            <span class="brand-sub">Shalbandi, Buner</span>
        </div>
        <div class="meta">
            <span id="clock" class="clock">--:--:--</span>
            <button class="logout-btn" onclick="auth.logout()">Logout</button>
        </div>
    </header>

    <aside class="sidebar">
        <div class="nav-section">Main</div>
        <a href="../index.html" class="nav-item">
            <span class="nav-icon"></span> Dashboard
        </a>
        <a href="./new-visit.html" class="nav-item active">
            <span class="nav-icon"></span> New Visit
        </a>
        <a href="./visits.html" class="nav-item">
            <span class="nav-icon"></span> Visits
        </a>
        <a href="./patients.html" class="nav-item">
            <span class="nav-icon"></span> Patients
        </a>
        <a href="./reports.html" class="nav-item">
            <span class="nav-icon"></span> Reports
        </a>
        <div class="nav-divider"></div>
        <div class="nav-section">Settings</div>
        <a href="./catalog.html" class="nav-item">
            <span class="nav-icon"></span> Test Catalog
        </a>
    </aside>

    <main class="main">

        <div class="page-header">
            <div class="page-header-left">
                <h1>New Visit</h1>
                <span class="subtitle">Select a patient and choose the tests to perform</span>
            </div>
        </div>

        <!-- ---------- PATIENT PICKER ---------- -->
        <div class="card">
            <div class="card-header">
                <h3>1. Patient</h3>
                <button class="btn btn-outline btn-sm" onclick="openAddPatient()">
                     New Patient
                </button>
            </div>

            <div class="patient-pick" id="patientPick">
                <div id="pickedPatient" class="hidden">
                    <div class="picked">
                        <div class="info">
                            <div class="name" id="pickedName">—</div>
                            <div class="meta" id="pickedMeta">—</div>
                        </div>
                        <button class="btn btn-outline btn-sm" onclick="clearPatient()">Change</button>
                    </div>
                </div>

                <div id="patientSearchBox">
                    <div class="form-group">
                        <label>Search patient</label>
                        <input type="text" id="patientSearch" placeholder="Type name or patient ID…" autocomplete="off">
                    </div>
                    <div id="patientResults" class="search-results hidden"></div>
                </div>
            </div>
        </div>

        <!-- ---------- TEST SELECTION ---------- -->
        <div class="card">
            <div class="card-header">
                <h3>2. Tests</h3>
                <span class="text-muted" id="testCount">Loading…</span>
            </div>

            <div class="test-grid" id="testGrid"></div>

            <div class="summary-box" style="margin-top: 16px;">
                <span class="label">Total Bill</span>
                <span class="total" id="totalAmount">Rs. 0</span>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <a href="./visits.html" class="btn btn-outline">Cancel</a>
                <button class="btn btn-primary btn-lg" id="createVisitBtn" onclick="createVisit()">
                    Create Visit
                </button>
            </div>
        </div>

    </main>

</div>

<!-- ============ ADD PATIENT MODAL ============ -->
<div id="patientModal" class="modal-overlay hidden">
    <div class="modal">
        <h3>New Patient</h3>

        <div class="form-row">
            <div class="form-group">
                <label>Name <span class="required">*</span></label>
                <input type="text" id="pName" placeholder="e.g. Ali Khan" maxlength="100">
            </div>
            <div class="form-group">
                <label>Age <span class="required">*</span></label>
                <input type="number" id="pAge" placeholder="e.g. 32" min="0" max="150">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Gender <span class="required">*</span></label>
                <select id="pGender">
                    <option value="">— Select —</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Contact</label>
                <input type="text" id="pContact" placeholder="e.g. 0300-1234567" maxlength="30">
            </div>
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text" id="pAddress" placeholder="Optional" maxlength="200">
        </div>

        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closePatientModal()">Cancel</button>
            <button class="btn btn-primary" id="savePatientBtn" onclick="savePatient()">Save Patient</button>
        </div>
    </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/animations.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/pages/new-visit.js"></script>

</body>
</html>
